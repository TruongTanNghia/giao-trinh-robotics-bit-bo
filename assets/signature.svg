<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="Chữ ký Trương Tấn Nghĩa · AI Học Lập Trình">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E4A63"/>
      <stop offset="0.55" stop-color="#1E8FA8"/>
      <stop offset="1" stop-color="#F28C1B"/>
    </linearGradient>
  </defs>

  <text x="280" y="92" text-anchor="middle"
        font-family="'Segoe Script', 'Brush Script MT', 'Snell Roundhand', 'Apple Chancery', 'Lucida Handwriting', cursive"
        font-size="56" fill="url(#ink)" fill-opacity="0" stroke="url(#ink)" stroke-width="1.2"
        stroke-dasharray="900" stroke-dashoffset="900">Trương Tấn Nghĩa<animate attributeName="stroke-dashoffset" values="900;0" dur="2.6s" fill="freeze"/><animate attributeName="fill-opacity" values="0;1" begin="2.2s" dur="1s" fill="freeze"/></text>

  <path d="M 78 118 C 170 104, 250 126, 330 112 S 460 100, 492 114 q 10 6 -4 10"
        fill="none" stroke="#F28C1B" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="520" stroke-dashoffset="520">
    <animate attributeName="stroke-dashoffset" values="520;0" begin="1.8s" dur="1.4s" fill="freeze"/>
  </path>

  <text x="280" y="152" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="600" letter-spacing="4" fill="#1E8FA8" opacity="0">AI HỌC LẬP TRÌNH · NEVER GIVE UP<animate attributeName="opacity" values="0;1" begin="3s" dur="1.2s" fill="freeze"/></text>
</svg>
